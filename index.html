<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>芒学 mángxué</title>
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まんしゅぇ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: one narrow column like a pocket notebook, bottom tab bar for the four places you go every day */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#E3E6EB; --ink:#1E2A3A; --muted:#5B6472;
  --accent:#2F6FDB; --accent-ink:#1F4E9E; --accent-soft:#E4ECFA;
  --manga:#D9822B; --manga-ink:#8A4A12; --manga-soft:#FDEBD8;
  --good:#1E7A4C; --good-soft:#E1F2E8; --bad:#B3261E; --bad-soft:#FBE3E1;
  --chip:#E8EAEE; --chip-ink:#3D4653;
  --font-body:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
  --font-display:'Zen Kaku Gothic New','Noto Sans JP',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161D; --surface:#1A212B; --line:#2A3441; --ink:#E8ECF1; --muted:#9AA5B4;
  --accent:#5B8FEA; --accent-ink:#A9C4F5; --accent-soft:#1E2F4D;
  --manga:#E3964A; --manga-ink:#F2C08F; --manga-soft:#3A2A1A;
  --good:#5FC48E; --good-soft:#173527; --bad:#F08A82; --bad-soft:#3C2120;
  --chip:#252E3A; --chip-ink:#C9D1DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#1A212B; --line:#2A3441; --ink:#E8ECF1; --muted:#9AA5B4;
  --accent:#5B8FEA; --accent-ink:#A9C4F5; --accent-soft:#1E2F4D;
  --manga:#E3964A; --manga-ink:#F2C08F; --manga-soft:#3A2A1A;
  --good:#5FC48E; --good-soft:#173527; --bad:#F08A82; --bad-soft:#3C2120;
  --chip:#252E3A; --chip-ink:#C9D1DC; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:560px;margin:0 auto;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar.manga>i{background:var(--manga)}
.bar>b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--accent-soft);color:var(--accent-ink)}
.pill.manga{background:var(--manga-soft);color:var(--manga-ink)}
.pill.gray{background:var(--chip);color:var(--chip-ink)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.wait::before{background:var(--manga)}
.status.off::before{background:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sub{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.seg{display:grid;gap:8px}
.seg button,.chip{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:0 14px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task label{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;cursor:pointer}
.task .t{font-size:12px;color:var(--muted)}
.task.manga .t{color:var(--manga-ink)}
.task .m{font-size:15px;font-weight:500}
.task.done .m{text-decoration:line-through;color:var(--muted)}
.big{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px}
.qtext{font-size:18px;line-height:1.8;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:2.4em;padding:0 6px;margin:0 2px;border-bottom:2px solid var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tf button{height:96px;border-radius:16px;background:var(--surface);font-size:40px;font-weight:700;cursor:pointer}
.tf .o{border:2px solid var(--accent);color:var(--accent-ink)}
.tf .x{border:2px solid var(--manga);color:var(--manga-ink)}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.7}
.choice b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:14px}
.verdict{display:flex;align-items:center;gap:14px}
.verdict .mark{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;flex:none}
.ok .mark{background:var(--good-soft);color:var(--good)}
.ng .mark{background:var(--bad-soft);color:var(--bad)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.warn{background:var(--manga-soft);color:var(--manga-ink);border-radius:14px;padding:12px 16px;font-size:14px}
.stepper{display:grid;grid-template-columns:minmax(64px,88px) 44px minmax(44px,1fr) 44px auto;gap:6px;align-items:center}
.stepper button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
.stepper input{text-align:center;padding:10px 2px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.table th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;font-size:11px;color:var(--muted);text-decoration:none}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);font-weight:700}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.brand{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap}
.brand ruby{font-family:var(--font-display);ruby-position:over}
.brand rt{font-family:var(--font-body);font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:.06em}
.brand .py{font-family:var(--font-body);font-weight:400;font-size:.62em;color:var(--muted);letter-spacing:.02em}
.brandline{justify-content:center;font-size:17px;color:var(--ink);margin-top:6px}
/* top bar and menu drawer */
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:8px 0 4px;background:var(--bg)}
.topname{font-family:var(--font-display);font-size:15px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
dialog.menu{margin:0;height:100%;max-height:none;width:min(82vw,320px);border:none;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 24px;background:var(--surface);color:var(--ink);overflow-y:auto}
dialog.menu::backdrop{background:rgba(10,14,20,.45)}
.menu h3{font-size:12px;color:var(--muted);margin:14px 12px 4px;font-weight:500}
.menu a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:15px}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
/* routines and daily records */
.rt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rt.first{border-top:none}
.rt .m{font-size:15px;font-weight:500}
.rbs{display:flex;gap:6px;flex:none}
.rb{width:48px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;color:var(--muted)}
.rb.ok[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.rb.ng[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.auto{font-size:13px;font-weight:700;flex:none}
.auto.ok{color:var(--good)}.auto.ng{color:var(--bad)}.auto.na{color:var(--muted);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);text-decoration:none;min-height:36px}
.badge.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:500}
.dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;flex:none}
.entry{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.entry .x{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);flex:none}
.addrow{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.calhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .wd{font-size:11px;color:var(--muted);text-align:center}
.cc{position:relative;min-height:60px;border-radius:10px;background:var(--surface);padding:4px 3px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);overflow:hidden;min-width:0}
.cc.pad{background:transparent}
.cc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cc .dn{font-size:12px;font-variant-numeric:tabular-nums;padding-left:2px}
.cc.fut .dn{color:var(--muted)}
.cc .bs{display:flex;flex-wrap:wrap;gap:1px 2px;font-size:11px;line-height:1.15}
.cc .off{font-size:10px;color:var(--muted)}
.cc b.ok{color:var(--good);font-size:15px;line-height:1}.cc b.ng{color:var(--bad);font-size:15px;line-height:1}
.cc .ms{position:absolute;right:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--manga)}
details.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.set>summary{min-height:52px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;list-style:none}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.set[open]>summary::after{content:"▴"}
details.set[open]{padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pal button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wds button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);padding:0}
.wds button[aria-pressed="true"]{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent-ink);font-weight:700}
.ci{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ci.first{border-top:none;padding-top:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.btn,.chip,.seg button,.choice{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="topbar">
  <button type="button" class="iconbtn" id="menuBtn" aria-label="メニューを開く" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="topname">芒学</span>
</header>
<dialog id="menu" class="menu" aria-label="メニュー"></dialog>
<div class="wrap" id="main" aria-live="polite">
  <div class="card"><h1 class="brand"><ruby>芒<rt>まん</rt>学<rt>しゅぇ</rt></ruby><span class="py">mángxué</span></h1><p class="muted">読み込み中です。少しお待ちください。</p></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<nav class="tabs" aria-label="メインメニュー">
  <a href="#home" data-v="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</a>
  <a href="#cal" data-v="cal"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー</a>
  <a href="#practice" data-v="practice"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/><path d="M9 10h6"/></svg>演習</a>
  <a href="#progress" data-v="progress"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>進捗</a>
</nav>

<script>
'use strict';
/* ---------- dates ---------- */
const WD='日月火水木金土';
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
// a "day" starts at the time set in ルーティン設定 (default 4:00), so a record made at 0:30 belongs to the previous day
function today(){return ymd(new Date(Date.now()-dayStartMin()*60000));}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5);}
function jpDate(s){const d=parseYmd(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';}
function md(s){const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate();}
function ym(s){return (s||today()).slice(0,7);}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}

/* ---------- plan: read from plan.json in the user's private data repository (nothing personal lives in this code) ---------- */
let PLAN=null;
const EMPTY_PLAN={v:1,start:'',study:{name:'学習',icon:'📖',units:[],phases:[],books:{}},create:{name:'創作',icon:'✏️',works:[],stages:[],focus:[]},schedule:[],milestones:[],batches:{},workdays:{}};
function P_(){return PLAN||EMPTY_PLAN;}
function units(){return P_().study.units||[];}
function UNIT(id){return units().find(u=>u.id===id)||null;}
function subj(id){return UNIT(id)||{id:id,name:id||'',short:id||'',start:'9999-12-31',end:'9999-12-31'};}
function weeksOf(u){return Math.max(1,Math.round((diffDays(u.start,u.end)+1)/7));}
function bookName(id){const b=P_().study.books||{};return b[id]||({exam:'本試験（公開問題）',sample:'サンプル問題'})[id]||id;}
function idPrefix(){return P_().study.idPrefix||{};}
function isBlankBook(id){return (P_().study.blankBooks||[]).includes(id);}
function currentSubject(ds){
  const u=units().find(x=>ds>=x.start&&ds<=x.end); if(u) return u;
  return units().find(x=>x.start>ds)||null;
}
function phaseLabel(ds){
  const u=units().find(x=>ds>=x.start&&ds<=x.end);
  if(u) return '今週：'+u.name+' '+(Math.floor(diffDays(u.start,ds)/7)+1)+'/'+weeksOf(u)+'週目';
  const ph=(P_().study.phases||[]).find(x=>ds>=x.from&&ds<=x.to);
  return ph?ph.label:'';
}
function focusOf(ds){return (P_().create.focus||[]).find(f=>ds<=f.until)||null;}
function fill(str,ds){
  if(!str) return '';
  const u=currentSubject(ds), f=focusOf(ds), lw=u&&ds>=u.start&&diffDays(ds,u.end)<7;
  return String(str).replace(/\{unit\}/g,u?u.short:'弱点').replace(/\{unitName\}/g,u?u.name:'')
    .replace(/\{focus\.weekday\}/g,f?(f.weekday||''):'').replace(/\{focus\.weekend\}/g,f?(f.weekend||''):'').replace(/\{focus\.note\}/g,f?(f.note||''):'')
    .replace(/\{lastWeekNote\}/g,lw?(P_().study.lastWeekNote||''):'').trim();
}
function tasksFor(ds){
  const sc=(P_().schedule||[]).find(x=>ds>=x.from&&ds<=x.to), wd=parseYmd(ds).getDay(), T=[];
  if(sc) for(const it of (wd===6?sc.sat:wd===0?sc.sun:sc.weekday)||[]){
    const title=fill(it.title,ds); if(!title) continue;
    T.push({id:it.id,time:it.time||'',kind:it.kind||'study',title,sub:fill(it.sub,ds)});
  }
  const b=(P_().batches||{})[ds]; if(b) T.push({id:'batch',time:b.time||'撮影',kind:'admin',title:b.title,sub:b.sub||''});
  const w=(P_().workdays||{})[ds]; if(w) T.push({id:'work',time:w.time||'作業日',kind:'admin',title:w.title,sub:w.sub||''});
  return T;
}
function countdowns(t){

/* ---------- tiny DOM builder (text only, never innerHTML for data) ---------- */
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='checked'){e.checked=!!v;continue;}
    if(k==='value'){e.value=v==null?'':v;continue;}
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,String(v));
  }
  for(const c of kids.flat(9)){if(c==null||c===false) continue; e.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return e;
}

/* ---------- device storage (IndexedDB) ---------- */
const IDB=(()=>{let p=null;
  function open(){if(p) return p;p=new Promise(res=>{try{const r=indexedDB.open('mangxue',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});return p;}
  async function put(k,v){const d=await open();if(!d) return;try{d.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
  async function all(){const d=await open();if(!d) return {};return new Promise(res=>{const out={};try{const r=d.transaction('kv').objectStore('kv').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};r.onerror=()=>res(out);}catch(e){res(out);}});}
  return {put,all};})();

const S={qbank:{},state:{},meta:{},log:{}};

function hm(t){const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function statusInfo(){

function statusNode(){const [c,t]=statusInfo();return el('span',{id:'status',class:'status'+(c==='ok'?'':' '+c)},t);}

function mergeState(id,remote){
  const loc=S.state[id]||{s:{}}; const r=(remote&&remote.s)||{}; let push=false;
  for(const [q,v] of Object.entries(r)){const l=loc.s[q];if(!l||(v.t||0)>(l.t||0)) loc.s[q]=clone(v);}
  for(const [q,v] of Object.entries(loc.s)){const rv=r[q];if(!rv||(v.t||0)>(rv.t||0)) push=true;}
  const rr=(remote&&remote.round)||1; if(rr>(loc.round||1)) loc.round=rr; else if((loc.round||1)>rr) push=true;
  S.state[id]=loc; IDB.put('state/'+id,loc); if(push) save('state/'+id);
}
function mergeMeta(id,remote){
  if(!remote) return;
  if(id==='checks'||id==='days'){   // per-day entries: the newer edit of each day wins
    const loc=S.meta[id]||{d:{}}; const r=remote.d||{}; let push=false;
    for(const [k,v] of Object.entries(r)){const l=loc.d[k];if(!l||(v.t||0)>(l.t||0)) loc.d[k]=clone(v);}
    for(const [k,v] of Object.entries(loc.d)){const rv=r[k];if(!rv||(v.t||0)>(rv.t||0)) push=true;}
    S.meta[id]=loc; IDB.put('meta/'+id,loc); if(push) save('meta/'+id); return;
  }
  const loc=S.meta[id];
  if(!loc||(remote.t||0)>(loc.t||0)){S.meta[id]=clone(remote);IDB.put('meta/'+id,S.meta[id]);}
  else if((loc.t||0)>(remote.t||0)) save('meta/'+id);
}
function mergeLog(k,remote){
  const loc=S.log[k]||{e:[]}; const seen=new Set(loc.e.map(x=>x[0]+'|'+x[1])); let add=false;
  for(const x of (remote&&remote.e)||[]){const key=x[0]+'|'+x[1];if(!seen.has(key)){loc.e.push(x);seen.add(key);add=true;}}
  if(add) loc.e.sort((a,b)=>a[0]-b[0]);
  S.log[k]=loc; IDB.put('log/'+k,loc);
}

/* GitHub (contents API). Each device writes only its own files, so writes never collide. */
const ERR={auth:'トークンが無効か期限切れです',forbidden:'リポジトリに入れません（名前と権限を確認）',rate:'GitHubの回数制限です。少し待つと再開します',conflict:'書き込みが重なりました。すぐにやり直します',net:'通信できませんでした'};
function b64(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0)+':'+s.length;}
function repoPath(){return '/repos/'+encodeURIComponent(SYNC.owner)+'/'+encodeURIComponent(SYNC.repo);}
async function gh(method,path,opt){
  opt=opt||{};
  let r;
  try{r=await fetch('https://api.github.com'+path,{method,cache:'no-store',
    headers:Object.assign({'Authorization':'Bearer '+SYNC.token,'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.body?{'Content-Type':'application/json'}:{}),
    body:opt.body?JSON.stringify(opt.body):undefined});}
  catch(e){throw {code:'net'};}
  if(r.status===401) throw {code:'auth'};
  if(r.status===403||r.status===429) throw {code:r.headers.get('x-ratelimit-remaining')==='0'||r.status===429?'rate':'forbidden'};
  if(r.status===404) return null;
  if(r.status===409&&method==='GET') return null;
  if(r.status===409||r.status===422) throw {code:'conflict'};
  if(!r.ok) throw {code:'http'+r.status};
  return opt.raw?r.text():r.json();
}
async function branch(){if(BRANCH) return BRANCH;const r=await gh('GET',repoPath());if(!r) throw {code:'forbidden'};BRANCH=r.default_branch||'main';return BRANCH;}
async function writeFile(path,obj){
  const text=JSON.stringify(obj), h=hashStr(text);
  if(KNOWN[path]&&KNOWN[path].h===h) return;
  const br=await branch();
  const put=(sha,withBranch)=>gh('PUT',repoPath()+'/contents/'+path,{body:Object.assign({message:'sync '+SYNC.name+': '+path.split('/').slice(-1)[0],content:b64(text)},withBranch?{branch:br}:{},sha?{sha}:{})});
  let res;
  try{res=await put(KNOWN[path]&&KNOWN[path].sha,true);if(res===null) res=await put(KNOWN[path]&&KNOWN[path].sha,false);}
  catch(e){if(e.code!=='conflict') throw e;const cur=await gh('GET',repoPath()+'/contents/'+path+'?ref='+encodeURIComponent(br));res=await put(cur&&cur.sha,true);}
  KNOWN[path]={sha:res&&res.content?res.content.sha:'',h};
}
async function pull(){
  const br=await branch();
  const tree=await gh('GET',repoPath()+'/git/trees/'+encodeURIComponent(br)+'?recursive=1');
  if(!tree||!Array.isArray(tree.tree)) return;
  const mine='devices/'+DEVICE+'/';
  for(const e of tree.tree){
    if(e.type!=='blob'||!/\.json$/.test(e.path)) continue;
    if(e.path.startsWith(mine)){if(!KNOWN[e.path]) KNOWN[e.path]={sha:e.sha,h:''};continue;}
    if(KNOWN[e.path]&&KNOWN[e.path].sha===e.sha) continue;
    let data=null;
    try{data=JSON.parse(await gh('GET',repoPath()+'/git/blobs/'+e.sha,{raw:true}));}catch(err){if(err&&err.code&&err.code!=='http500') throw err;}
    let m;
    if(data&&e.path==='plan.json'){PLAN=data;IDB.put('__plan',PLAN);planChanged=true;}
    else if(data&&((m=e.path.match(/^questions\/([A-Za-z0-9_.-]+)\.json$/))||(m=e.path.match(/^devices\/[^/]+\/q\/([A-Za-z0-9_.-]+)\.json$/)))){
      const cur=S.qbank[m[1]];
      if(Array.isArray(data.items)&&(!cur||(data.t||0)>(cur.t||0))){const doc=Object.assign({},data);delete doc.local;S.qbank[m[1]]=doc;IDB.put('qbank/'+m[1],doc);qChanged=true;}
    }else if(data&&/^devices\/[^/]+\/state\.json$/.test(e.path)){
      for(const [id,v] of Object.entries(data.state||{})) mergeState(id,v);
      for(const [id,v] of Object.entries(data.meta||{})) mergeMeta(id,v);
    }else if(data&&(m=e.path.match(/^devices\/[^/]+\/log-(\d{4}-\d{2})\.json$/))) mergeLog(m[1],data);
    KNOWN[e.path]={sha:e.sha,h:''};
  }
}
async function push(){
  const snap=[...dirty]; dirty.clear();
  try{
    let stateDirty=false;
    for(const p of snap){
      const i=p.indexOf('/'), c=p.slice(0,i), id=p.slice(i+1);
      if(c==='state'||c==='meta') stateDirty=true;
      else if(c==='log'){const own=((S.log[id]||{}).e||[]).filter(x=>x[6]==null||x[6]===DEVICE);if(own.length) await writeFile('devices/'+DEVICE+'/log-'+id+'.json',{v:1,device:DEVICE,e:own});}
      else if(c==='qbank'){const d=S.qbank[id];if(d&&d.local) await writeFile('devices/'+DEVICE+'/q/'+id+'.json',d);}
    }
    if(stateDirty) await writeFile('devices/'+DEVICE+'/state.json',{v:1,device:DEVICE,name:SYNC.name,state:S.state,meta:S.meta});
  }catch(e){for(const p of snap) dirty.add(p);throw e;}
  finally{IDB.put('__dirty',[...dirty]);}
}
async function sync(){
  if(!SYNC){updateStatus();return;}
  if(!navigator.onLine){netDown=true;updateStatus();return;}
  if(syncing){syncAgain=true;return;}
  syncing=true; updateStatus();
  try{await pull();await push();syncErr='';netDown=false;lastSync=Date.now();IDB.put('__lastSync',lastSync);}
  catch(e){
    const c=e&&e.code;
    if(c==='net'){netDown=true;syncErr='';}
    else if(c==='rate'||c==='conflict'){syncErr='';scheduleSync(60000);}
    else syncErr=ERR[c]||('GitHubでエラー（'+c+'）');
  }
  finally{syncing=false;IDB.put('__known',KNOWN);updateStatus();softRender();if(planChanged&&!(VIEW==='practice'&&P.step!=='setup')){planChanged=false;qChanged=false;render();}else if(qChanged&&VIEW==='import'){qChanged=false;render();}if(syncAgain){syncAgain=false;scheduleSync(1500);}}
}

    const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));if(j&&j.o&&j.r&&j.k) return j;}catch(_){}
  return null;
}

/* ---------- learning logic ---------- */
// 周回方式：単元（問題集×科目）ごとに「今何周目か」だけを持ち、先の出題日は決めない
function roundOf(docId){const s=S.state[docId];return (s&&s.round)||1;}
function realDocs(){return Object.entries(S.qbank).filter(([,d])=>d&&d.book!=='sample');}
function allItems(filter){
  const out=[];
  for(const [docId,d] of Object.entries(S.qbank)){
    if(!d||!Array.isArray(d.items)) continue;
    if(filter&&!filter(d)) continue;
    for(const q of d.items) out.push({docId,doc:d,q});
  }
  out.sort((a,b)=>(a.doc.book>b.doc.book?1:a.doc.book<b.doc.book?-1:0)||((a.q.no||0)-(b.q.no||0)));
  return out;
}
function stOf(docId,qid){const s=S.state[docId];return s&&s.s?s.s[qid]:null;}
function record(docId,q,ok,conf,ms,blanks){
  const sd=S.state[docId]||(S.state[docId]={s:{}});
  const cur=Object.assign({c:0,w:0,k:0},sd.s[q.id]||{}), now=Date.now(), rd=roundOf(docId);
  cur.last=today();cur.lastOk=!!ok&&conf!==2;cur.conf=conf;cur.t=now;cur.lr=rd;
  if(ok) cur.c++; else cur.w++;
  if(conf===2) cur.k=(cur.k||0)+1;
  if(blanks) cur.b=blanks;
  cur.h=(cur.h||[]).concat([[rd,ok?1:0,conf===2?1:0]]).slice(-12);
  sd.s[q.id]=cur; save('state/'+docId);
  const k=ym(); S.log[k]=S.log[k]||{e:[]}; S.log[k].e.push([now,q.id,ok?1:0,conf,ms||0,rd,DEVICE]); save('log/'+k);
  return {cur,round:rd};
}
function weakTags(){
  const m={};
  for(const it of allItems(d=>d.book!=='sample')){
    const s=stOf(it.docId,it.q.id); if(!s) continue; const tot=(s.c||0)+(s.w||0); if(!tot) continue;
    for(const g of (it.q.tags&&it.q.tags.length?it.q.tags:['その他'])){
      const k=subj(it.doc.subject).short+'・'+g; const x=m[k]||(m[k]={n:0,ok:0,kan:0}); x.n+=tot; x.ok+=Math.max(0,(s.c||0)-(s.k||0)); x.kan+=(s.k||0);}
  }
  return Object.entries(m).filter(([,x])=>x.n>=3).map(([k,x])=>({k,rate:Math.round(x.ok/x.n*100),n:x.n,kan:x.kan})).sort((a,b)=>a.rate-b.rate).slice(0,5);
}
function coverage(subId){
  const items=allItems(d=>d.subject===subId&&d.book!=='sample');
  let answered=0,ok=0;
  for(const it of items){const s=stOf(it.docId,it.q.id);if(s&&(s.c+s.w)>0){answered++;if(s.lastOk) ok++;}}
  return {total:items.length,answered,ok};
}
function studyStats(){
  const t=today(); let W=0,done=0,plan=0; const rows=[];
  for(const s of units()){
    const c=coverage(s.id), cov=c.total?c.answered/c.total:0;
    const p=t<s.start?0:t>s.end?1:(diffDays(s.start,t)+1)/(diffDays(s.start,s.end)+1);
    W+=weeksOf(s);done+=weeksOf(s)*cov;plan+=weeksOf(s)*p;rows.push({s,c,cov,p});
  }
  return {pct:W?Math.round(done/W*100):0,plan:W?Math.round(plan/W*100):0,rows};
}
function works(){return P_().create.works||[];}
function stages(){return P_().create.stages||[];}
function manga(){const m=clone(S.meta.manga)||{t:0};for(const w of works()) if(!m[w.id]) m[w.id]={pages:w.pages||16,st:[],cover:0,plot:0};return m;}
function bodyFrac(b){const p=Math.max(1,b.pages||1);return stages().reduce((a,st,i)=>a+(st.w||0)*Math.min((b.st||[])[i]||0,p)/p,0);}
function workPct(w,b){const c=P_().create;const hb=(b.pages||0)*(c.hoursPerPage||8),hc=w.cover?(c.coverHours||10):0,hp=w.plot?(c.plotHours||8):0;
  return {done:hb*bodyFrac(b)+hc*(b.cover||0)/100+hp*(b.plot?1:0),total:Math.max(1,hb+hc+hp)};}

  const m=manga(), c=P_().create; let D=0,T=0; const per={};

function checks(){return S.meta.checks||(S.meta.checks={d:{}});}

  const t=today(), d=parseYmd(t), off=(d.getDay()+6)%7, mon=addDays(t,-off); let all=0,done=0;
  for(let i=0;i<7;i++){const ds=addDays(mon,i);if(P_().start&&ds<P_().start) continue;for(const k of tasksFor(ds)){all++;if(isChecked(ds,k.id)) done++;}}

function setLife(fn){const x=clone(life());fn(x);x.t=Date.now();S.meta.life=x;save('meta/life');}
function toMin(hm){if(!hm) return null;const a=String(hm).split(':').map(Number);return a[0]*60+(a[1]||0);}
function fmtMin(n){n=Math.round(n||0);const h=Math.floor(n/60),m=n%60;return h?(h+'時間'+(m?m+'分':'')):(m+'分');}
function dayStartMin(){const l=typeof S!=='undefined'&&S.meta&&S.meta.life;return toMin((l&&l.dayStart)||'04:00')||0;}

  const v=dayRec(ds).rec[it.id];
  if(it.type==='sleep'){const m=sleepMin(v);return m!=null&&m>=life().sleepTarget;}
  if(it.type==='span') return Array.isArray(v)&&v.length>0;
  if(it.type==='memo') return !!(v&&String(v).trim());

/* practice */
function poolFor(subject,book){
  const hasReal=allItems(d=>d.subject===subject&&d.book!=='sample').length>0;
  return allItems(d=>d.subject===subject&&(book==='all'?(d.book!=='sample'||!hasReal):d.book===book));
}
function modeFilter(mode){
  if(mode==='cont') return it=>{const s=stOf(it.docId,it.q.id);return !s||(s.lr||0)<roundOf(it.docId);};
  if(mode==='miss') return it=>{const s=stOf(it.docId,it.q.id);return s&&(s.note||s.lastOk===false);};
  return ()=>true;
}
function viewPractice(){
  if(!P.subject){const s=currentSubject(today());P.subject=(s||units()[0]||{id:''}).id;}
  if(P.step==='q') return viewQuestion();
  if(P.step==='a') return viewAnswer();
  if(P.step==='done') return viewDone();
  const pool=poolFor(P.subject,P.book);
  const n={cont:pool.filter(modeFilter('cont')).length,miss:pool.filter(modeFilter('miss')).length,all:pool.length};
  const books=['all',...new Set([...Object.keys(P_().study.books||{}),...Object.values(S.qbank).map(d=>d&&d.book).filter(Boolean)])];
  const docIds=[...new Set(pool.map(x=>x.docId))];
  const roundLine=docIds.map(id=>{const d=S.qbank[id], rd=roundOf(id);const done=d.items.filter(q=>{const s=stOf(id,q.id);return s&&(s.lr||0)>=rd;}).length;return bookName(d.book)+'：'+rd+'周目 '+done+' / '+d.items.length;}).join('　');
  const newRound=()=>{for(const id of docIds){const sd=S.state[id]||(S.state[id]={s:{}});sd.round=roundOf(id)+1;save('state/'+id);}P.mode='cont';toast(roundOf(docIds[0])+'周目を始めます');render();};
  const start=()=>{
    let q=pool.filter(modeFilter(P.mode));
    if(P.count) q=q.slice(0,P.count);
    P.queue=q.map(x=>[x.docId,x.q.id]);P.i=0;P.stats={n:0,ok:0};P.step='q';P.conf=0;P.t0=Date.now();render();

  return [

    el('div',{style:'display:flex;flex-direction:column;gap:8px'},el('h2',{class:'muted',style:'font-size:13px'},'ひと言の題材（今日の記録から）'),
      el('div',{class:'chips'},topicsToday().map(tp=>el('button',{type:'button',class:'chip','aria-pressed':String(SH.topic===tp),onclick:e=>{SH.topic=tp;input.placeholder='題材：'+tp;e.target.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===e.target)));input.focus();}},tp)))),
    el('label',{class:'field',for:'line'},'ひと言',input),
    el('fieldset',{style:'border:none;margin:0;padding:0;display:flex;flex-direction:column'},el('legend',{class:'small muted',style:'padding:0;margin-bottom:4px'},'載せるもの'),
      opt('study',(P_().study.icon||'📖')+' '+P_().study.name+'の％','o-study'),opt('manga',(P_().create.icon||'✏️')+' '+P_().create.name+'の％','o-manga'),opt('delta','前回からの変化','o-delta'),opt('tag','ハッシュタグ','o-tag'),
      el('input',{type:'text',id:'tagtext','aria-label':'ハッシュタグ',value:SH.tagText,placeholder:'#〜',oninput:e=>{SH.tagText=e.target.value;refresh();}})),
    offline?el('button',{type:'button',class:'btn',disabled:true},'オフラインのためシェアできません'):link,
    el('p',{class:'xs muted',style:'text-align:center'},moved?'投稿するかどうかはXの画面で決めます。アプリが自動で投稿することはありません。':'前回のシェアから％が動いていません。同じ数字が並ぶので、次の機会でも大丈夫です。')
  ];
}

/* import */
function viewImport(){
  const t=today();
  const BT=P_().batches||{}, nextB=Object.keys(BT).sort().find(d=>d>=t);
  const docs=Object.entries(S.qbank).filter(([,d])=>d&&Array.isArray(d.items)).sort((a,b)=>a[0]>b[0]?1:-1);
  const checksList=[];
  for(const [docId,d] of docs) for(const q of d.items) if(q.check) checksList.push({docId,d,q});
  const confirm=(x,patch)=>{const d=clone(S.qbank[x.docId]);const q=d.items.find(i=>i.id===x.q.id);Object.assign(q,patch);delete q.check;d.t=Date.now();d.local=1;S.qbank[x.docId]=d;save('qbank/'+x.docId);toast('確認済みにしました');render();};
  const checkCard=x=>{
    const q=x.q, sid='fix-'+q.id;
    let ansCtl;
    if(q.type==='tf') ansCtl=el('select',{id:sid+'-a'},(()=>{const o=el('option',{value:'1'},'○');if(q.answer) o.selected=true;return o;})(),(()=>{const o=el('option',{value:'0'},'×');if(!q.answer) o.selected=true;return o;})());
    else if(q.type==='mc5') ansCtl=el('select',{id:sid+'-a'},['A','B','C','D','E'].map(k=>{const o=el('option',{value:k},k);if(q.correct===k) o.selected=true;return o;}));
    else ansCtl=el('input',{type:'text',id:sid+'-a',value:(q.blanks||[]).map(b=>b.answer).join(' / ')});
    return el('div',{class:'card'},
      el('div',{class:'between'},el('h2',{},bookName(x.d.book)+' '+subj(x.d.subject).short+' No.'+q.no),el('span',{class:'xs muted'},q.page?'本 p.'+q.page:'')),
      el('p',{class:'small',style:'color:var(--manga-ink)'},'確認してほしい点：'+q.check),
      el('label',{class:'field',for:sid+'-s'},'問題文',el('textarea',{id:sid+'-s',rows:4,value:q.stem})),
      el('label',{class:'field',for:sid+'-a'},q.type==='blank'?'空欄の答え（A / B / … の順に「 / 」区切り）':'正解',ansCtl),
      el('button',{type:'button',class:'btn sub sm',onclick:()=>{
        const stem=document.getElementById(sid+'-s').value, av=document.getElementById(sid+'-a').value;
        const patch={stem};
        if(q.type==='tf') patch.answer=av==='1'; else if(q.type==='mc5') patch.correct=av;
        else {const arr=av.split('/').map(s=>s.trim());patch.blanks=(q.blanks||[]).map((b,i)=>({k:b.k,answer:arr[i]!=null?arr[i]:b.answer}));}
        confirm(x,patch);}},'本と同じなので確認済みにする'));};

  /* backup */
  const exportAll=async()=>{
    const data=JSON.stringify({app:'mangxue',v:1,at:new Date().toISOString(),qbank:S.qbank,state:S.state,meta:S.meta,log:S.log});
    try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      const a=el('a',{href:url,download:'mangxue-backup-'+t+'.json'});document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);toast('書き出しました（ダウンロードフォルダ）');}
    catch(e){toast('書き出せませんでした');}
  };
  const importFile=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='shaxnote'&&j.app!=='mangxue') throw 0;
      for(const [id,d] of Object.entries(j.qbank||{})){const cur=S.qbank[id];if((!cur||(d.t||0)>(cur.t||0))){S.qbank[id]=Object.assign({},d,{local:1});save('qbank/'+id);}}
      for(const [id,d] of Object.entries(j.state||{})) mergeState(id,d);
      for(const [id,d] of Object.entries(j.meta||{})) mergeMeta(id,d);
      for(const [k,d] of Object.entries(j.log||{})) mergeLog(k,d);
      toast('読み込みました');render();}catch(_){toast('このファイルは読み込めません（バックアップのJSONを選んでください）');}};
    r.readAsText(f);
  };
  return [
    el('h1',{},'取り込み'),statusNode(),syncCard(),
    nextB?el('div',{class:'card between',style:'flex-direction:row'},el('span',{class:'small muted'},'次の撮影'),el('span',{class:'small',style:'font-weight:500;text-align:right'},md(nextB)+'（'+WD[parseYmd(nextB).getDay()]+'）'+(BT[nextB].time?' '+BT[nextB].time:'')+' '+BT[nextB].title)):null,
    el('div',{class:'card'},el('h2',{},'取り込み済みの問題'),
      docs.length?el('div',{class:'scroll'},el('table',{class:'table'},el('thead',{},el('tr',{},el('th',{},'問題集'),el('th',{},'科目'),el('th',{},'問題数'),el('th',{},'要確認'),el('th',{},'番号の抜け'))),
        el('tbody',{},docs.map(([id,d])=>el('tr',{},el('td',{},bookName(d.book)||d.book),el('td',{},subj(d.subject)?subj(d.subject).short:d.subject),el('td',{class:'num'},String(d.items.length)),
          el('td',{class:'num'},String(d.items.filter(q=>q.check).length)),el('td',{class:'num'},(d.missing&&d.missing.length)?'No.'+d.missing.join('・'):'なし'))))))
      :el('p',{class:'small muted'},'まだありません。撮影したPDFをClaudeに送ると、同期を設定した端末に自動で届きます。')),
    docs.some(([,d])=>d.missing&&d.missing.length)?el('div',{class:'warn'},'番号が抜けている問題があります。その番号のページだけ撮り直して送ってください。'):null,
    checksList.length?el('h2',{},'要確認：本と見比べてください（'+checksList.length+'件）'):null,
    checksList.slice(0,10).map(checkCard),
    checksList.length>10?el('p',{class:'small muted'},'残り'+(checksList.length-10)+'件は、上を確認すると順に出てきます。'):null,
    el('div',{class:'card'},el('h2',{},'バックアップ'),el('p',{class:'small muted'},'同期を設定していれば、記録は自動でほかの端末にもそろいます。書き出しは、念のための控えとして月に1回ほどで十分です。'),
      el('button',{type:'button',class:'btn sub sm',onclick:exportAll},'バックアップを書き出す'),
      el('label',{class:'field',for:'restore'},'ファイルを読み込む（問題ファイル・バックアップ）',el('input',{type:'file',id:'restore',accept:'application/json,.json',onchange:importFile})))
  ];
}

/* ---------- boot ---------- */
(async function boot(){
  const all=await IDB.all();
  for(const [k,v] of Object.entries(all)){
    if(k==='__dirty'){(v||[]).forEach(p=>dirty.add(p));continue;}
    if(k==='__sync'){SYNC=v||null;continue;}
    if(k==='__known'){KNOWN=v||{};continue;}
    if(k==='__lastSync'){lastSync=v||0;continue;}
    if(k==='__device'){DEVICE=v||'';continue;}
    if(k==='__plan'){PLAN=v||null;continue;}
    const i=k.indexOf('/'); if(i<0) continue; const c=k.slice(0,i); if(S[c]) S[c][k.slice(i+1)]=v;
  }
  if(!DEVICE){DEVICE='d'+Math.random().toString(36).slice(2,10);IDB.put('__device',DEVICE);}
  if(location.hash.indexOf('#sync=')===0){PENDING=parseSyncPayload(location.hash.slice(6));history.replaceState(null,'',location.pathname+'#import');}
  document.getElementById('menuBtn').addEventListener('click',openMenu);
  document.getElementById('menu').addEventListener('click',e=>{const m=e.currentTarget;if(e.target!==m) return;const r=m.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) m.close();});
  render();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w) return;w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller) toast('新しい版があります。アプリを開き直すと切り替わります');});});
    }).catch(()=>{});
  }
  window.addEventListener('online',()=>{netDown=false;sync();});
  window.addEventListener('offline',updateStatus);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') sync();});
  setInterval(()=>{if(document.visibilityState==='visible') sync();},120000);
  sync();
})();
</script>
